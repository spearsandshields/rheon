[package]
name = "dsntk-evaluator"
version = { workspace = true }
authors = { workspace = true }
description = "ÐecisionToolkit | Evaluator"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "toolkit", "evaluator"]
documentation = "https://docs.rs/dsntk-evaluator"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["dsntk-feel/dashu", "dsntk-feel-evaluator/dashu", "dsntk-feel-parser/dashu", "dsntk-model-evaluator/dashu"]
intel = ["dsntk-feel/intel", "dsntk-feel-evaluator/intel", "dsntk-feel-parser/intel", "dsntk-model-evaluator/intel"]

[dependencies]
dsntk-common = { workspace = true }
dsntk-feel = { workspace = true }
dsntk-feel-evaluator = { workspace = true }
dsntk-feel-parser = { workspace = true }
dsntk-macros = { workspace = true }
dsntk-model-evaluator = { workspace = true }
