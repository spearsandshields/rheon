[package]
name = "dsntk-gendoc"
version = { workspace = true }
authors = { workspace = true }
description = "ÐecisionToolkit | Documentation generator"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "toolkit", "documentation"]
documentation = "https://docs.rs/dsntk-gendoc"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["dsntk-feel/dashu", "dsntk-model/dashu"]
intel = ["dsntk-feel/intel", "dsntk-model/intel"]

[dependencies]
antex = { workspace = true }
domrs = { workspace = true }
markdown = { workspace = true }
dsntk-common = { workspace = true }
dsntk-feel = { workspace = true }
dsntk-model = { workspace = true }

[dev-dependencies]
dsntk-examples = { workspace = true }
dsntk-recognizer = { workspace = true }
