[workspace]

resolver = "2"

members = [
    "common",
    "dsntk",
    "evaluator",
    "examples",
    "feel",
    "feel-grammar",
    "feel-evaluator",
    "feel-number",
    "feel-parser",
    "feel-regex",
    "feel-temporal",
    "gendoc",
    "macros",
    "model",
    "model-evaluator",
    "recognizer",
    "server",
    "workspace",
    # rheon additions (see README): the FEEL engine as a wasm32-wasip1 module
    "wasm/feel-wasm"
]

[workspace.package]
version = "0.3.1-dev"
authors = ["Dariusz Depta <depta@engos.de>"]
repository = "https://github.com/spearsandshields/rheon"
homepage = "https://spearsandshields.github.io/rheon/"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
actix-web = "4.13.0"
antex = "0.2.1"
base64 = "0.22.1"
chrono = "0.4.44"
chrono-tz = "0.10.4"
convert_case = "0.11.0"
clap = { version = "4.6.1", features = ["cargo"] }
dfp-number-sys = "0.2.14"
dashu-base = { version = "0.6.1", default-features = false }
dashu-float = { version = "0.6.2", default-features = false }
dashu-int = { version = "0.6.2", default-features = false }
difference = "2.0.0"
domrs = "0.0.16"
markdown = "1.0.0"
petgraph = "0.8.3"
proc-macro2 = "1.0.106"
quote = "1.0.45"
regex = "1.12.3"
fancy-regex = { version = "0.19.2", default-features = false, features = ["std", "unicode", "perf"] }
reqwest = { version = "0.13.3", features = ["blocking", "json", "rustls"] }
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.117", features = ["fold", "full"] }
uuid = { version = "1.23.1", features = ["v4"] }
uriparse = "0.6.4"
url = "2.5.8"
urlencoding = "2.1.3"
walkdir = "2.5.0"
dsntk-common = { path = "common" }
dsntk-evaluator = { path = "evaluator", default-features = false }
dsntk-examples = { path = "examples" }
rheon-feel = { path = "feel", default-features = false }
rheon-feel-evaluator = { path = "feel-evaluator", default-features = false }
dsntk-feel-grammar = { path = "feel-grammar" }
rheon-feel-number = { path = "feel-number", default-features = false }
rheon-feel-parser = { path = "feel-parser", default-features = false }
rheon-feel-regex = { path = "feel-regex" }
rheon-feel-temporal = { path = "feel-temporal", default-features = false }
dsntk-gendoc = { path = "gendoc", default-features = false }
dsntk-macros = { path = "macros" }
dsntk-model = { path = "model", default-features = false }
rheon-model-evaluator = { path = "model-evaluator", default-features = false }
dsntk-recognizer = { path = "recognizer" }
dsntk-server = { path = "server", default-features = false }
dsntk-workspace = { path = "workspace", default-features = false }

# rheon: the upstream dsntk-rs commit this repository's dsntk crates are based on. Reported by
# the wasm module's `info` op as `upstreamCommit`, next to the repository HEAD (`engineCommit`).
[workspace.metadata.rheon]
upstream-commit = "c76aee02187183b3659a9051f3ebb283630066f7"
upstream = "https://github.com/dsntk/dsntk-rs.git"

# rheon: profile for the wasm modules (`scripts/build-wasm.sh` builds with `--profile wasm`).
# Kept separate from `release` so the native dsntk binaries keep their default settings.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
# Integer overflow must never wrap silently in an "exact" engine: with overflow checks a missed
# overflow becomes a panic (a detectable `crash`) instead of a wrong answer.
overflow-checks = true
