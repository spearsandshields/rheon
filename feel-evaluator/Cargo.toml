[package]
name = "rheon-feel-evaluator"
version = { workspace = true }
authors = { workspace = true }
description = "rheon | FEEL expression evaluator (fork of dsntk-feel-evaluator)"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "rheon", "feel"]
documentation = "https://docs.rs/rheon-feel-evaluator"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["rheon-feel/dashu", "rheon-feel-parser/dashu", "rheon-feel-temporal/dashu"]
intel = ["rheon-feel/intel", "rheon-feel-parser/intel", "rheon-feel-temporal/intel"]

[dependencies]
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dsntk-common = { workspace = true }
rheon-feel = { workspace = true }
rheon-feel-parser = { workspace = true }
rheon-feel-regex = { workspace = true }
rheon-feel-temporal = { workspace = true }
dsntk-macros = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
