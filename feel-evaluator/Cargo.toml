[package]
name = "flowstone-feel-evaluator"
version = { workspace = true }
authors = { workspace = true }
description = "ÐecisionToolkit | FEEL expressions evaluator"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "toolkit", "feel"]
documentation = "https://docs.rs/flowstone-feel-evaluator"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["flowstone-feel/dashu", "flowstone-feel-parser/dashu", "flowstone-feel-temporal/dashu"]
intel = ["flowstone-feel/intel", "flowstone-feel-parser/intel", "flowstone-feel-temporal/intel"]

[dependencies]
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dsntk-common = { workspace = true }
flowstone-feel = { workspace = true }
flowstone-feel-parser = { workspace = true }
flowstone-feel-regex = { workspace = true }
flowstone-feel-temporal = { workspace = true }
dsntk-macros = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
