[package]
name = "dsntk-workspace"
version = { workspace = true }
authors = { workspace = true }
description = "ÐecisionToolkit | User workspace"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "toolkit", "workspace"]
documentation = "https://docs.rs/dsntk-workspace"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["flowstone-feel/dashu", "flowstone-feel-evaluator/dashu", "dsntk-model/dashu", "flowstone-model-evaluator/dashu"]
intel = ["flowstone-feel/intel", "flowstone-feel-evaluator/intel", "dsntk-model/intel", "flowstone-model-evaluator/intel"]

[dependencies]
antex = { workspace = true }
walkdir = { workspace = true }
dsntk-common = { workspace = true }
flowstone-feel = { workspace = true }
flowstone-feel-evaluator = { workspace = true }
dsntk-macros = { workspace = true }
dsntk-model = { workspace = true }
flowstone-model-evaluator = { workspace = true }

[dev-dependencies]
dsntk-examples = { workspace = true }
