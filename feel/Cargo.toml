[package]
name = "rheon-feel"
version = { workspace = true }
authors = { workspace = true }
description = "rheon | FEEL definitions (fork of dsntk-feel)"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "rheon", "feel"]
documentation = "https://docs.rs/rheon-feel"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["rheon-feel-number/dashu", "rheon-feel-temporal/dashu"]
intel = ["rheon-feel-number/intel", "rheon-feel-temporal/intel"]

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
dsntk-common = { workspace = true }
rheon-feel-number = { workspace = true }
rheon-feel-temporal = { workspace = true }
dsntk-macros = { workspace = true }
