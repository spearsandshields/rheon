[package]
name = "flowstone-model-evaluator"
version = { workspace = true }
authors = { workspace = true }
description = "ÐecisionToolkit | DMN model evaluator"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "toolkit", "evaluator"]
documentation = "https://docs.rs/flowstone-model-evaluator"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["flowstone-feel/dashu", "flowstone-feel-evaluator/dashu", "flowstone-feel-parser/dashu", "flowstone-feel-temporal/dashu", "dsntk-model/dashu"]
intel = ["flowstone-feel/intel", "flowstone-feel-evaluator/intel", "flowstone-feel-parser/intel", "flowstone-feel-temporal/intel", "dsntk-model/intel"]

[dependencies]
dsntk-common = { workspace = true }
flowstone-feel = { workspace = true }
flowstone-feel-evaluator = { workspace = true }
flowstone-feel-parser = { workspace = true }
flowstone-feel-temporal = { workspace = true }
dsntk-macros = { workspace = true }
dsntk-model = { workspace = true }

[dev-dependencies]
antex = { workspace = true }
walkdir = { workspace = true }
dsntk-examples = { workspace = true }
dsntk-recognizer = { workspace = true }
