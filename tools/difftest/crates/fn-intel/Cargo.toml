# The real rheon-feel-number crate source (lib.rs), built with feature `intel`.
# dfp-number-sys from crates.io has FFI signature bugs on some targets; run.sh injects the
# patched copy from tools/fetch-dfp-number-sys.sh through `--config patch.crates-io.dfp-number-sys.path=...`.
[package]
name = "fn-intel"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "../../../../feel-number/src/lib.rs"

[dependencies]
dfp-number-sys = "0.2.14"
dsntk-common = "=0.3.0"
dsntk-macros = "=0.3.0"

[features]
default = ["intel"]
intel = []
dashu = []
