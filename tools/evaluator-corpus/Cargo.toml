# FEEL-level differential harness: evaluates a corpus of FEEL expressions with the number
# backend selected by the feature (`intel` or `dashu`); run.sh builds both and compares.
[package]
name = "evaluator-corpus"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "feel-eval"
path = "src/main.rs"

[dependencies]
serde_json = "1"
rheon-feel = { path = "../../feel", default-features = false }
rheon-feel-parser = { path = "../../feel-parser", default-features = false }
rheon-feel-evaluator = { path = "../../feel-evaluator", default-features = false }

[features]
intel = ["rheon-feel/intel", "rheon-feel-parser/intel", "rheon-feel-evaluator/intel"]
dashu = ["rheon-feel/dashu", "rheon-feel-parser/dashu", "rheon-feel-evaluator/dashu"]

[workspace]
