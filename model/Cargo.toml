[package]
name = "rheon-model"
version = { workspace = true }
authors = { workspace = true }
description = "rheon | DMN model and parser (fork of dsntk-model)"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "rheon", "model"]
documentation = "https://docs.rs/rheon-model"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["rheon-feel/dashu", "rheon-feel-parser/dashu"]
intel = ["rheon-feel/intel", "rheon-feel-parser/intel"]

[dependencies]
petgraph = { workspace = true }
roxmltree = { workspace = true }
dsntk-common = { workspace = true }
rheon-feel = { workspace = true }
rheon-feel-parser = { workspace = true }
dsntk-macros = { workspace = true }
dsntk-recognizer = { workspace = true }

[dev-dependencies]
dsntk-examples = { workspace = true }
