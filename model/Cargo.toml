[package]
name = "dsntk-model"
version = { workspace = true }
authors = { workspace = true }
description = "ÐecisionToolkit | DMN model and parser"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "toolkit", "model"]
documentation = "https://docs.rs/dsntk-model"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
default = ["dashu"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["dsntk-feel/dashu", "dsntk-feel-parser/dashu"]
intel = ["dsntk-feel/intel", "dsntk-feel-parser/intel"]

[dependencies]
petgraph = { workspace = true }
roxmltree = { workspace = true }
dsntk-common = { workspace = true }
dsntk-examples = { workspace = true }
dsntk-feel = { workspace = true }
dsntk-feel-parser = { workspace = true }
dsntk-macros = { workspace = true }
dsntk-recognizer = { workspace = true }
