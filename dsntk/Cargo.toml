[package]
name = "dsntk"
version = { workspace = true }
authors = { workspace = true }
description = "ÐecisionToolkit | Design and execute decisions"
categories = ["development-tools", "command-line-utilities", "finance", "parsing"]
keywords = ["dmn", "decision", "toolkit", "dsntk"]
documentation = "https://docs.rs/dsntk"
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
# carried from dsntk with manifest-only changes; never published from rheon
publish = false

[features]
default = ["dashu"]
tck = ["dsntk-server/tck"]
# Number backend (exactly one): `dashu` (pure Rust, default) or `intel` (dfp-number-sys, C).
# Forwarded to every dsntk dependency so that one selection covers the whole build graph.
dashu = ["dsntk-evaluator/dashu", "rheon-feel/dashu", "rheon-feel-parser/dashu", "dsntk-gendoc/dashu", "rheon-model/dashu", "dsntk-server/dashu", "dsntk-workspace/dashu"]
intel = ["dsntk-evaluator/intel", "rheon-feel/intel", "rheon-feel-parser/intel", "dsntk-gendoc/intel", "rheon-model/intel", "dsntk-server/intel", "dsntk-workspace/intel"]

[dependencies]
actix-web = { workspace = true }
antex = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
dsntk-common = { workspace = true }
dsntk-evaluator = { workspace = true }
rheon-feel = { workspace = true }
rheon-feel-parser = { workspace = true }
rheon-feel-regex = { workspace = true }
dsntk-gendoc = { workspace = true }
dsntk-macros = { workspace = true }
rheon-model = { workspace = true }
dsntk-recognizer = { workspace = true }
dsntk-server = { workspace = true }
dsntk-workspace = { workspace = true }
