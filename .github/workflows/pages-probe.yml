# Temporary: isolates the GitHub Pages deployment (to be deleted).
name: pages-probe
on:
  workflow_dispatch:
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: echo a
  gate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: a
    runs-on: ubuntu-latest
    steps:
      - run: echo gate open
  c1:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - run: echo c1
