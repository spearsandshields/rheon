# rheon CI: the engine's own test suites, the wasm module and the JS side.
# (The build-*.yml workflows next to this file are upstream dsntk's release-binary builds.)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  engine:
    name: engine tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable # rust-toolchain.toml pins the actual version and its components
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Skipped: `external_functions` (feel-evaluator) and `dmn_3_0076` (model-evaluator) call a
      # Java external-function service, which rheon does not support; `compare_the_number_of_models`
      # (dsntk-examples) walks a DMN TCK checkout at ../tck that CI does not have; the dsntk-server
      # `utils::tests::getting_*` tests assert that the checkout directory is named `dsntk`.
      - run: cargo test --workspace --no-fail-fast -- --skip external_functions --skip dmn_3_0076 --skip compare_the_number_of_models --skip utils::tests::getting_

  wasm:
    name: feel.wasm + runtime + playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bootstrap # wasm target + wasmtime into .tools/ (sha256-checked)
      - run: npm run build:wasm # dist/feel.wasm + interface check against CONTRACT §1
      - run: npm run test:rust # native contract tests of rheon-feel-wasm
      - run: npm run test:rust:wasm # the same tests under wasmtime
      - run: npm run test:runtime # @rheon/feel-runtime (node --test)
      - run: npm run smoke # dist/feel.wasm under node:wasi
      - run: npm run stack # stack headroom of dist/feel.wasm: Node main thread and worker, Wasmtime with a 4 MiB wasm stack
      - run: npm run build:playground # svelte-check + vite build + third-party notices
      - uses: actions/upload-artifact@v7
        with:
          name: feel.wasm
          path: dist/feel.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: playground
          path: apps/playground/dist

  # The playground is the public demo: https://spearsandshields.github.io/rheon/ (GitHub Pages, source
  # "GitHub Actions" in the repository settings). Deployed from main only, after the wasm job.
  pages:
    name: deploy playground to GitHub Pages
    # Push runs are main-only by the trigger above, so excluding pull requests is the whole gate.
    if: github.event_name != 'pull_request'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: playground
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
