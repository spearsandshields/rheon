# rheon CI: the group tier of the tests (engine, wasm module, JS side, official TCK) on every pull
# request and push to main, then the playground deploy.
# (The build-*.yml workflows next to this file are upstream dsntk's release-binary builds.)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The group tier (scripts/tier.mjs, README "Test tiers"): fmt, check, the workspace tests and the
  # Rust copies of the TCK tests, clippy, feel.wasm with its identity check, the tools' own tests,
  # the number oracle's quick run, the contract tests, smoke, stack, the playground and the
  # official TCK at its pinned commits. Its table of steps and times ends the log. On CI the times
  # are reported without a budget until five runs give one (1.5 times the slowest, and this
  # timeout twice that).
  group:
    name: group tier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable # rust-toolchain.toml pins the actual version and its components
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the identity check runs the previous release, which can crash Node 22 itself (tools/identity/README.md)
          cache: npm
      - run: npm ci
      - run: npm run bootstrap # wasm target + wasmtime into .tools/ (sha256-checked)
      # the number oracle's Python: the runner's own python3 in a virtual environment with mpmath,
      # pinned by hash
      - run: python3 -m venv .tools/py && .tools/py/bin/pip install --require-hashes -r tools/number-oracle/requirements.txt
      # The identity check downloads the previous release's feel.wasm (sha256-checked) with the
      # workflow's token; no step restores its cache, so the reference is evaluated in full.
      - run: npm run tier:group
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: .tools/py/bin/python
      - uses: actions/upload-artifact@v7
        with:
          name: tier-logs
          path: .tools/tier/group
        if: always()
      - uses: actions/upload-artifact@v7
        with:
          name: feel.wasm
          path: dist/feel.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: playground
          path: apps/playground/dist

  # The playground is the public demo: https://spearsandshields.github.io/rheon/ (GitHub Pages, source
  # "GitHub Actions" in the repository settings). Deployed from main only, after the group tier.
  pages:
    name: deploy playground to GitHub Pages
    # Push runs are main-only by the trigger above, so excluding pull requests is the whole gate.
    if: github.event_name != 'pull_request'
    needs: group
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: playground
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
